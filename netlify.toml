# Netlify site root: import this repository without changing these paths.
# The Next.js application lives in PROFILE.OS-main, not the repository root.
[build]
  base = "PROFILE.OS-main"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Pinned in package.json and package-lock.json for reproducible builds.
# Do not install a second Next.js Runtime plugin in the Netlify UI.
[[plugins]]
  package = "@netlify/plugin-nextjs"
