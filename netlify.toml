# The Next.js application lives at the repository root.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Keep API routes and Next.js image handling through Netlify's runtime.
[[plugins]]
  package = "@netlify/plugin-nextjs"
